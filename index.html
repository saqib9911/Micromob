<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MicroScope Pro</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #1a1a1a; --panel-2: #252525;
    --fg: #eee; --muted: #888;
    --accent: #00b3ff; --accent-2: #00e5a0; --danger: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px; display: flex; flex-direction: column;
    height: 100dvh; position: relative; }

  /* Stage */
  #stage { position: relative; flex: 1; overflow: hidden;
    background: #000; display: flex; align-items: center;
    justify-content: center; touch-action: none; }
  #video { max-width: 100%; max-height: 100%;
    object-fit: contain; transform-origin: center center;
    will-change: transform; display: block; }
  #freezeCanvas { position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain;
    display: none; pointer-events: none; z-index: 5; }
  #freezeCanvas.on { display: block; }

  #grid, #crosshair { position: absolute; inset: 0;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 3; }
  #grid.on, #crosshair.on { opacity: 1; }
  #grid { background-image:
      linear-gradient(to right, rgba(255,255,255,.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.35) 1px, transparent 1px);
    background-size: 33.333% 33.333%; }
  #crosshair::before, #crosshair::after {
    content:''; position: absolute; background: var(--accent); }
  #crosshair::before { left: 50%; top: 45%; bottom: 45%; width: 1px; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 45%; right: 45%; height: 1px; transform: translateY(-50%); }

  /* Chips / top bar */
  .chip { background: rgba(20,20,20,.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--fg); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 8px 12px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 36px; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

  #topBar { position: absolute; top: max(6px, env(safe-area-inset-top));
    left: 6px; right: 6px; display: flex; gap: 6px;
    z-index: 20; flex-wrap: wrap; pointer-events: none; }
  #topBar > * { pointer-events: auto; }
  #fsBtn { position: absolute; top: max(6px, env(safe-area-inset-top));
    right: 6px; z-index: 25; }

  /* Side sliders */
  .sideSlider { position: absolute; z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 8px; background: rgba(20,20,20,.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 20px; border: 1px solid rgba(255,255,255,.1);
    top: 50%; transform: translateY(-50%); }
  #zoomPanel { left: 6px; }
  #rightPanel { right: 6px; }
  .sideSlider input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: transparent; width: 28px; height: 120px;
    writing-mode: vertical-lr; direction: rtl; }
  .sideSlider input[type=range]::-webkit-slider-runnable-track {
    width: 4px; background: rgba(255,255,255,.15); border-radius: 2px; }
  .sideSlider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    margin-left: -9px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .sideSlider input[type=range]::-moz-range-track {
    width: 4px; background: rgba(255,255,255,.15); border-radius: 2px; }
  .sideSlider input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; }
  .sideLabel { font-size: 10px; color: var(--muted); }
  .sideValue { font-size: 11px; font-weight: 600; color: var(--accent); }

  /* Zoom presets */
  #presets { position: absolute; bottom: 92px; left: 50%;
    transform: translateX(-50%); display: flex; gap: 4px;
    z-index: 20; padding: 4px; border-radius: 20px;
    background: rgba(20,20,20,.7);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1); }
  #presets button { background: transparent; color: var(--fg);
    border: none; padding: 6px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 600; cursor: pointer; }
  #presets button.active { background: var(--accent); color: #000; }

  /* Bottom bar */
  #bottomBar { position: absolute; bottom: max(10px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%); display: flex;
    gap: 10px; z-index: 20; padding: 8px 12px;
    background: rgba(20,20,20,.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 40px; border: 1px solid rgba(255,255,255,.12);
    align-items: center; }
  .ctrlBtn { background: transparent; border: none; color: var(--fg);
    width: 44px; height: 44px; border-radius: 50%;
    font-size: 20px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; }
  .ctrlBtn.active { background: var(--accent); color: #000; }
  #shutter { width: 60px; height: 60px; border-radius: 50%;
    background: #fff; border: 3px solid rgba(255,255,255,.4);
    position: relative; }
  #shutter::after { content: ''; position: absolute; inset: 4px;
    border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px #000; }
  #recordBtn.recording { color: var(--danger); }

  /* Recording indicator */
  #recIndicator { position: absolute;
    top: max(50px, calc(env(safe-area-inset-top) + 50px));
    left: 50%; transform: translateX(-50%);
    background: rgba(255,59,48,.9); color: #fff;
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; z-index: 25;
    display: none; align-items: center; gap: 6px; }
  #recIndicator.on { display: flex; }
  #recIndicator .dot { width: 8px; height: 8px;
    border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* Settings drawer */
  #settingsPanel { position: absolute; top: 0; right: 0; bottom: 0;
    width: min(330px, 88vw);
    background: rgba(15,15,15,.98);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,.1);
    padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    overflow-y: auto; z-index: 40; transform: translateX(100%);
    transition: transform .25s ease-out; }
  #settingsPanel.open { transform: translateX(0); }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center;
    justify-content: space-between; padding: 10px 0;
    gap: 10px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .row label { font-size: 13px; }
  .row select { background: var(--panel-2); color: var(--fg);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  .row input[type=range] { -webkit-appearance: none; appearance: none;
    width: 130px; height: 6px; background: rgba(255,255,255,.15);
    border-radius: 3px; outline: none; }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
  .row input[type=text] { width: 130px; background: var(--panel-2);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; color: var(--fg); padding: 6px 8px; font-size: 12px; }
  .toggle { width: 44px; height: 26px; border-radius: 13px;
    background: rgba(255,255,255,.15); position: relative;
    cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .2s; }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(18px); }

  /* Toast */
  #toast { position: absolute; left: 50%; top: 60%;
    transform: translate(-50%, 0);
    background: rgba(0,0,0,.85); color: #fff;
    padding: 10px 16px; border-radius: 10px;
    font-size: 13px; z-index: 100; opacity: 0;
    pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, -10px); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="freezeCanvas"></canvas>
  <div id="grid"></div>
  <div id="crosshair"></div>
</div>

<div id="topBar">
  <button class="chip" id="torchBtn">🔦 <span>Torch</span></button>
  <button class="chip" id="expoLockBtn">🔒 <span>Lock</span></button>
  <button class="chip" id="focusModeBtn">🎯 AF</button>
  <button class="chip" id="gridBtn">▦</button>
  <button class="chip" id="freezeBtn">❄️</button>
</div>
<button class="chip" id="fsBtn">⛶</button>

<div class="sideSlider" id="zoomPanel">
  <div class="sideValue" id="zoomVal">1.0x</div>
  <input type="range" id="zoomSlider" min="1" max="10" step="0.01" value="1">
  <div class="sideLabel">ZOOM</div>
</div>

<div class="sideSlider" id="rightPanel">
  <div class="sideValue" id="focusVal">AF</div>
  <input type="range" id="focusSlider" min="0" max="100" step="1" value="50">
  <div class="sideLabel">FOCUS</div>
  <div style="height:6px"></div>
  <div class="sideValue" id="expoVal">0.0</div>
  <input type="range" id="expoSlider" min="-2" max="2" step="0.1" value="0">
  <div class="sideLabel">EV</div>
</div>

<div id="presets">
  <button data-zoom="1">1x</button>
  <button data-zoom="2">2x</button>
  <button data-zoom="5">5x</button>
  <button data-zoom="10">10x</button>
</div>

<div id="recIndicator"><span class="dot"></span><span id="recTime">00:00</span></div>

<div id="bottomBar">
  <button class="ctrlBtn" id="galleryBtn" title="Save all">🖼️</button>
  <button class="ctrlBtn" id="recordBtn" title="Record">🎥</button>
  <button class="ctrlBtn" id="shutter" title="Capture"></button>
  <button class="ctrlBtn" id="settingsBtn" title="Settings">⚙️</button>
</div>

<div id="settingsPanel">
  <h2 style="font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
    Settings <button class="chip" id="closeSettings">✕</button>
  </h2>

  <div class="section">
    <h3>Camera</h3>
    <div class="row"><label>Resolution</label>
      <select id="resSelect">
        <option value="3840x2160">4K (3840×2160)</option>
        <option value="1920x1080" selected>FHD (1920×1080)</option>
        <option value="1280x720">HD (1280×720)</option>
        <option value="640x480">SD (640×480)</option>
        <option value="428x240">428p</option>
      </select></div>
    <div class="row"><label>Facing</label>
      <select id="facingSelect">
        <option value="environment" selected>Back</option>
        <option value="user">Front</option>
      </select></div>
    <div class="row"><label>Mic (for notes)</label>
      <div class="toggle" id="micTgl"></div></div>
  </div>

  <div class="section">
    <h3>Image</h3>
    <div class="row"><label>Brightness</label><input type="range" id="brightRange" min="50" max="200" value="100"></div>
    <div class="row"><label>Contrast</label><input type="range" id="contrastRange" min="50" max="200" value="100"></div>
    <div class="row"><label>Saturation</label><input type="range" id="satRange" min="0" max="200" value="100"></div>
    <div class="row"><label>Mirror H</label><div class="toggle" id="mirrorHTgl"></div></div>
    <div class="row"><label>Mirror V</label><div class="toggle" id="mirrorVTgl"></div></div>
    <div class="row"><label>Rotate 180°</label><div class="toggle" id="rotate180Tgl"></div></div>
  </div>

  <div class="section">
    <h3>White Balance <span style="color:var(--accent);font-size:10px" id="wbMode">auto</span></h3>
    <div class="row"><label>Temp (K)</label>
      <input type="range" id="wbRange" min="2000" max="9000" step="100" value="5500"></div>
  </div>

  <div class="section">
    <h3>Overlays</h3>
    <div class="row"><label>Rule of Thirds</label><div class="toggle" id="gridTgl"></div></div>
    <div class="row"><label>Crosshair</label><div class="toggle" id="crossTgl"></div></div>
    <div class="row"><label>Note (watermark)</label>
      <input type="text" id="noteInput" placeholder="iPhone 12"></div>
  </div>

  <div class="section">
    <h3>Zoom Behavior</h3>
    <div class="row"><label>Zoom Speed</label>
      <input type="range" id="zoomSpeedRange" min="5" max="60" value="22"></div>
    <div class="row"><label>Max Total Zoom</label>
      <select id="maxZoomSelect">
        <option value="4">4x</option>
        <option value="8">8x</option>
        <option value="10" selected>10x</option>
        <option value="20">20x</option>
        <option value="50">50x</option>
      </select></div>
  </div>

  <div class="section">
    <h3>Device Capabilities</h3>
    <div id="capsInfo" style="font-size:11px;color:var(--muted);line-height:1.6"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   Globals
   ============================================================ */
let stream = null, videoTrack = null, imageCapture = null;
let caps = {};
let mediaRecorder = null, recordedChunks = [];
let recStartTime = 0, recTimer = null;
let capturedPhotos = [];
let wantAudio = false;

/* Zoom */
let hwZoomMin = 1, hwZoomMax = 1;
let maxZoomTotal = 10;
let targetZoom = 1, currentZoom = 1;
let zoomLerp = 0.22;
let zoomRAF = null;
let lastHwApplied = -1;
let currentDigitalScale = 1;

/* Focus / exposure */
let expoCompRange = null;
let isExpoLocked = false, isTorchOn = false, focusManual = false;

/* Pinch / tap */
let pinch = null, lastTapTime = 0, tapTimeout = null;

/* Visual state */
let vs = { bright: 100, contrast: 100, sat: 100,
           mirrorH: false, mirrorV: false, rotate180: false };

/* DOM helpers */
const $ = id => document.getElementById(id);
const stage = $('stage'), video = $('video'),
      freezeCanvas = $('freezeCanvas'),
      gridEl = $('grid'), crossEl = $('crosshair'),
      zoomSlider = $('zoomSlider'), zoomVal = $('zoomVal'),
      focusSlider = $('focusSlider'), focusVal = $('focusVal'),
      expoSlider = $('expoSlider'), expoVal = $('expoVal'),
      settingsPanel = $('settingsPanel');

/* Toast */
function toast(msg, ms=1500) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ============================================================
   Camera
   ============================================================ */
async function startCamera() {
  const res = $('resSelect').value;
  const facing = $('facingSelect').value;
  const [w, h] = res.split('x').map(Number);

  if (stream) stream.getTracks().forEach(t => t.stop());

  const constraints = {
    video: {
      facingMode: { ideal: facing },
      width: { ideal: w }, height: { ideal: h },
      zoom: true,
      focusMode: 'continuous',
      exposureMode: 'continuous',
      whiteBalanceMode: 'continuous'
    },
    audio: wantAudio
  };

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    videoTrack = stream.getVideoTracks()[0];

    caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    console.log('Caps:', caps);
    updateCapsInfo();

    if ('ImageCapture' in window) {
      try { imageCapture = new ImageCapture(videoTrack); } catch(e){ imageCapture = null; }
    }

    /* Zoom bounds */
    hwZoomMin = caps.zoom?.min ?? 1;
    hwZoomMax = caps.zoom?.max ?? 1;
    if (maxZoomTotal < hwZoomMin) maxZoomTotal = hwZoomMin;
    targetZoom = hwZoomMin;
    currentZoom = hwZoomMin;
    lastHwApplied = -1;
    updateZoomUIRange();

    /* Exposure */
    if (caps.exposureCompensation) {
      expoCompRange = caps.exposureCompensation;
      expoSlider.min = expoCompRange.min;
      expoSlider.max = expoCompRange.max;
      expoSlider.step = expoCompRange.step ?? 0.1;
      expoSlider.value = 0;
      expoSlider.parentElement.style.opacity = 1;
    } else {
      expoCompRange = null;
      expoSlider.parentElement.style.opacity = 0.4;
    }

    /* Torch */
    $('torchBtn').classList.toggle('hidden', !caps.torch);

    /* Focus */
    focusSlider.parentElement.style.opacity = 1;

    /* WB */
    if (caps.colorTemperature) {
      const ct = caps.colorTemperature;
      $('wbRange').min = ct.min; $('wbRange').max = ct.max;
      $('wbRange').step = ct.step ?? 100;
      $('wbRange').value = 5500;
    } else {
      $('wbRange').parentElement.style.opacity = 0.4;
    }

    applyVisualTransforms(1);
    renderZoom();
    toast('Camera ready · ' + videoTrack.label, 1200);

  } catch (err) {
    console.error(err);
    toast('Camera error: ' + err.message, 3000);
  }
}

function updateCapsInfo() {
  const lines = [];
  const show = (l, o) => { if (o) lines.push(`<b>${l}</b>: ${JSON.stringify(o)}`); };
  show('zoom', caps.zoom);
  show('torch', caps.torch);
  show('focusMode', caps.focusMode);
  show('focusDistance', caps.focusDistance);
  show('exposureCompensation', caps.exposureCompensation);
  show('colorTemperature', caps.colorTemperature);
  if (!lines.length) lines.push('<i>No advanced capabilities reported</i>');
  $('capsInfo').innerHTML = lines.join('<br>');
}

/* ============================================================
   Smooth Zoom (lerp animation – no jumping)
   ============================================================ */
function updateZoomUIRange() {
  zoomSlider.min = hwZoomMin;
  zoomSlider.max = maxZoomTotal;
}

function setTargetZoom(z) {
  targetZoom = Math.max(hwZoomMin, Math.min(maxZoomTotal, z));
  if (!zoomRAF) zoomRAF = requestAnimationFrame(animateZoomStep);
}

function animateZoomStep() {
  const diff = targetZoom - currentZoom;
  if (Math.abs(diff) < 0.002) {
    currentZoom = targetZoom;
    renderZoom();
    zoomRAF = null;
    return;
  }
  currentZoom += diff * zoomLerp;
  renderZoom();
  zoomRAF = requestAnimationFrame(animateZoomStep);
}

function renderZoom() {
  const total = currentZoom;
  let hwZ = total, digZ = 1;

  if (caps.zoom && total > hwZoomMax) {
    hwZ = hwZoomMax;
    digZ = total / hwZoomMax;
  }
  // HW zoom (throttled by change threshold)
  if (caps.zoom && Math.abs(hwZ - lastHwApplied) > 0.005) {
    lastHwApplied = hwZ;
    videoTrack.applyConstraints({ advanced: [{ zoom: hwZ }] }).catch(()=>{});
  }
  currentDigitalScale = digZ;
  applyVisualTransforms(digZ);

  zoomVal.textContent = total.toFixed(1) + 'x';
  if (document.activeElement !== zoomSlider) zoomSlider.value = total;

  document.querySelectorAll('#presets button').forEach(b => {
    b.classList.toggle('active', Math.abs(parseFloat(b.dataset.zoom) - total) < 0.15);
  });
}

/* ============================================================
   Visual transforms
   ============================================================ */
function applyVisualTransforms(digitalScale = 1) {
  const parts = [`scale(${digitalScale})`];
  if (vs.mirrorH) parts.push('scaleX(-1)');
  if (vs.mirrorV) parts.push('scaleY(-1)');
  if (vs.rotate180) parts.push('rotate(180deg)');
  video.style.transform = parts.join(' ');
  video.style.filter = `brightness(${vs.bright}%) contrast(${vs.contrast}%) saturate(${vs.sat}%)`;
  freezeCanvas.style.filter = video.style.filter;
}

/* ============================================================
   Sliders
   ============================================================ */
zoomSlider.addEventListener('input', () => {
  setTargetZoom(parseFloat(zoomSlider.value));
});

document.querySelectorAll('#presets button').forEach(b => {
  b.addEventListener('click', () => setTargetZoom(parseFloat(b.dataset.zoom)));
});

expoSlider.addEventListener('input', async () => {
  expoVal.textContent = parseFloat(expoSlider.value).toFixed(1);
  if (!videoTrack || !expoCompRange) return;
  try {
    await videoTrack.applyConstraints({
      advanced: [{ exposureCompensation: parseFloat(expoSlider.value) }]
    });
  } catch(e){}
});

focusSlider.addEventListener('input', async () => {
  if (!videoTrack) return;
  const v = parseFloat(focusSlider.value);
  focusVal.textContent = v + '%';
  focusManual = true;
  $('focusModeBtn').textContent = '🎯 MF';
  $('focusModeBtn').classList.add('active');

  if (caps.focusDistance) {
    const { min, max } = caps.focusDistance;
    const dist = min + (v / 100) * (max - min);
    try {
      await videoTrack.applyConstraints({
        advanced: [{ focusMode: 'manual', focusDistance: dist }]
      });
    } catch(e){}
  } else {
    // No manual focus — try point of interest near center
    try {
      await videoTrack.applyConstraints({
        advanced: [{ pointsOfInterest: [{ x: 0.5, y: 0.5 }], focusMode: 'single-shot' }]
      });
    } catch(e){}
  }
});

/* ============================================================
   Pinch zoom (smooth) + double-tap + tap-to-focus
   ============================================================ */
function getTouchDist(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    pinch = {
      startDist: getTouchDist(e.touches[0], e.touches[1]),
      startZoom: targetZoom
    };
  } else if (e.touches.length === 1) {
    const now = Date.now();
    if (now - lastTapTime < 280) {
      // Double tap → toggle 1x / 3x
      e.preventDefault();
      if (Math.abs(targetZoom - 1) > 0.15) setTargetZoom(1);
      else setTargetZoom(Math.min(3, maxZoomTotal));
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    const t = e.touches[0];
    clearTimeout(tapTimeout);
    tapTimeout = setTimeout(() => doTapFocus(t.clientX, t.clientY), 280);
  }
}, { passive: false });

stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    e.preventDefault();
    const dist = getTouchDist(e.touches[0], e.touches[1]);
    const scale = dist / pinch.startDist;
    setTargetZoom(pinch.startZoom * scale);
  }
}, { passive: false });

stage.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinch = null;
}, { passive: true });

/* Mouse wheel zoom (desktop) */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = -Math.sign(e.deltaY) * 0.35 * maxZoomTotal / 10;
  setTargetZoom(targetZoom + delta);
}, { passive: false });

async function doTapFocus(clientX, clientY) {
  if (!videoTrack) return;
  const rect = stage.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width;
  const y = (clientY - rect.top) / rect.height;
  try {
    await videoTrack.applyConstraints({
      advanced: [{ pointsOfInterest: [{ x, y }], focusMode: 'single-shot' }]
    });
    showFocusRing(clientX, clientY);
    setTimeout(() => {
      if (!focusManual) {
        videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
    }, 2000);
  } catch(err){}
}

function showFocusRing(x, y) {
  const ring = document.createElement('div');
  ring.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:60px;height:60px;
    border:2px solid var(--accent);border-radius:50%;
    transform:translate(-50%,-50%) scale(1.4);
    pointer-events:none;z-index:30;
    transition:transform .3s,opacity .3s;opacity:1;`;
  document.body.appendChild(ring);
  requestAnimationFrame(() => ring.style.transform = 'translate(-50%,-50%) scale(1)');
  setTimeout(() => ring.style.opacity = 0, 700);
  setTimeout(() => ring.remove(), 1100);
}

/* ============================================================
   Torch / Expo lock / Focus mode
   ============================================================ */
$('torchBtn').addEventListener('click', async () => {
  if (!videoTrack || !caps.torch) return;
  isTorchOn = !isTorchOn;
  try {
    await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });

});

$('expoLockBtn').addEventListener('click', async () => {
  if (!videoTrack || !caps.exposureMode) return;
  isExpoLocked = !isExpoLocked;
  try {
    await videoTrack.applyConstraints({
      advanced: [{ exposureMode: isExpoLocked ? 'manual' : 'continuous' }]
    });

    $('expoLockBtn').innerHTML = isExpoLocked ? '🔓 <span>Locked</span>' : '🔒 <span>Lock</span>';
  } catch(e){ isExpoLocked = !isExpoLocked; toast('Lock unsupported'); }
});

$('focusModeBtn').addEventListener('click', async () => {
  if (!videoTrack || !caps.focusMode) return;
  focusManual = !focusManual;
  try {
    await videoTrack.applyConstraints({
      advanced: [{ focusMode: focusManual ? 'manual' : 'continuous' }]
    });

    $('focusModeBtn').classList.toggle('active', focusManual);
    focusVal.textContent = focusManual ? focusSlider.value + '%' : 'AF';
  } catch(e){ focusManual = !focusManual; }
});

/* ============================================================
   Grid / Crosshair / Freeze
   ============================================================ */
$('gridBtn').addEventListener('click', () => {
  const on = gridEl.classList.toggle('on');
  $('gridBtn').classList.toggle('active', on);
  $('gridTgl').classList.toggle('on', on);
});
$('gridTgl').addEventListener('click', () => $('gridBtn').click());
$('crossTgl').addEventListener('click', () => {
  const on = crossEl.classList.toggle('on');
  $('crossTgl').classList.toggle('on', on);
});

$('freezeBtn').addEventListener('click', () => {
  const on = !freezeCanvas.classList.contains('on');
  if (on) {
    freezeCanvas.width = video.videoWidth;
    freezeCanvas.height = video.videoHeight;
    freezeCanvas.getContext('2d').drawImage(video, 0, 0);
    freezeCanvas.classList.add('on');
    $('freezeBtn').classList.add('active');
  } else {
    freezeCanvas.classList.remove('on');
    $('freezeBtn').classList.remove('active');
  }
});

/* ============================================================
   Photo capture
   ============================================================ */
$('shutter').addEventListener('click', capturePhoto);

async function capturePhoto() {
  if (!videoTrack) return;
  // Flash effect
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99;opacity:.7;transition:opacity .2s;pointer-events:none';
  document.body.appendChild(flash);
  requestAnimationFrame(() => flash.style.opacity = 0);
  setTimeout(() => flash.remove(), 250);

  try {
    let blob;
    if (imageCapture) {
      try { blob = await imageCapture.takePhoto(); }
      catch(e){ blob = await fallbackCapture(); }
    } else {
      blob = await fallbackCapture();
    }
    if (!blob) throw new Error('No data');
    const url = URL.createObjectURL(blob);
    capturedPhotos.push({ url, blob, ts: Date.now() });
    toast('📸 Saved · ' + capturedPhotos.length);
  } catch(e) {
    console.error(e);
    toast('Capture failed: ' + e.message);
  }
}

async function fallbackCapture() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.95));
}

function downloadPhoto(p) {
  const a = document.createElement('a');
  a.href = p.url;
  const ts = new Date(p.ts).toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.download = 'microscope_' + ts + (p.isVideo ? '.webm' : '.jpg');
  a.click();
}

/* ============================================================
   Video recording
   ============================================================ */
$('recordBtn').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  else startRecording();
});

function startRecording() {
  if (!stream) return;
  recordedChunks = [];
  let options = { mimeType: 'video/webm;codecs=vp9' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm;codecs=vp8' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options = { mimeType: 'video/webm' };
    }
  }
  try { mediaRecorder = new MediaRecorder(stream, options); }
  catch(e){ toast('Recording unsupported'); return; }

  mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    capturedPhotos.push({ url: URL.createObjectURL(blob), blob, ts: Date.now(), isVideo: true });
    toast('🎥 Video saved');
    $('recordBtn').classList.remove('recording');
    $('recIndicator').classList.remove('on');
    clearInterval(recTimer);
  };
  mediaRecorder.start(1000);
  $('recordBtn').classList.add('recording');
  $('recIndicator').classList.add('on');
  recStartTime = Date.now();
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStartTime) / 1000);
    $('recTime').textContent =
      String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 500);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

/* ============================================================
   Gallery (download all)
   ============================================================ */
$('galleryBtn').addEventListener('click', () => {
  if (!capturedPhotos.length) return toast('No photos yet');
  capturedPhotos.forEach((p, i) => setTimeout(() => downloadPhoto(p), i * 200));
  toast('Downloading ' + capturedPhotos.length + ' files…');
});

/* ============================================================
   Settings drawer
   ============================================================ */
$('settingsBtn').addEventListener('click', () => settingsPanel.classList.add('open'));
$('closeSettings').addEventListener('click', () => settingsPanel.classList.remove('open'));

$('resSelect').addEventListener('change', () => { saveSettings(); startCamera(); });
$('facingSelect').addEventListener('change', () => { saveSettings(); startCamera(); });

$('micTgl').addEventListener('click', () => {
  wantAudio = !wantAudio;
  $('micTgl').classList.toggle('on', wantAudio);
  saveSettings();
  startCamera();
});

/* Filters */
const reapply = () => applyVisualTransforms(currentDigitalScale);
$('brightRange').addEventListener('input', e => { vs.bright = e.target.value; reapply(); saveSettings(); });
$('contrastRange').addEventListener('input', e => { vs.contrast = e.target.value; reapply(); saveSettings(); });
$('satRange').addEventListener('input', e => { vs.sat = e.target.value; reapply(); saveSettings(); });

$('mirrorHTgl').addEventListener('click', () => {
  vs.mirrorH = !vs.mirrorH;
  $('mirrorHTgl').classList.toggle('on', vs.mirrorH);
  reapply(); saveSettings();
});
$('mirrorVTgl').addEventListener('click', () => {
  vs.mirrorV = !vs.mirrorV;
  $('mirrorVTgl').classList.toggle('on', vs.mirrorV);
  reapply(); saveSettings();
});
$('rotate180Tgl').addEventListener('click', () => {
  vs.rotate180 = !vs.rotate180;
  $('rotate180Tgl').classList.toggle('on', vs.rotate180);
  reapply(); saveSettings();
});

/* White balance */
$('wbRange').addEventListener('input', async e => {
  if (!videoTrack || !caps.colorTemperature) return;
  const v = parseFloat(e.target.value);
  try {
    await videoTrack.applyConstraints({
      advanced: [{ whiteBalanceMode: 'manual', colorTemperature: v }]
    });
    $('wbMode').textContent = v + 'K';
  } catch(e){ $('wbMode').textContent = 'auto'; }
});

/* Zoom speed */
$('zoomSpeedRange').addEventListener('input', e => {
  zoomLerp = parseFloat(e.target.value) / 100;
  saveSettings();
});

/* Max total zoom */
$('maxZoomSelect').addEventListener('change', e => {
  maxZoomTotal = parseFloat(e.target.value);
  updateZoomUIRange();
  setTargetZoom(Math.min(currentZoom, maxZoomTotal));
  saveSettings();
});

/* ============================================================
   Fullscreen
   ============================================================ */
$('fsBtn').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch(e){ toast('Fullscreen unsupported'); }
});

/* ============================================================
   Settings persistence
   ============================================================ */
function saveSettings() {
  try {
    localStorage.setItem('msp_settings', JSON.stringify({
      res: $('resSelect').value,
      facing: $('facingSelect').value,
      mic: wantAudio,
      vs: { ...vs },
      maxZoomTotal,
      zoomSpeed: $('zoomSpeedRange').value,
      grid: gridEl.classList.contains('on'),
      cross: crossEl.classList.contains('on'),
      note: $('noteInput').value
    }));
  } catch(e){}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem('msp_settings');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.res) $('resSelect').value = s.res;
    if (s.facing) $('facingSelect').value = s.facing;
    if (s.mic) { wantAudio = true; $('micTgl').classList.add('on'); }
    if (s.vs) {
      vs = { ...vs, ...s.vs };
      $('brightRange').value = vs.bright;
      $('contrastRange').value = vs.contrast;
      $('satRange').value = vs.sat;
      $('mirrorHTgl').classList.toggle('on', vs.mirrorH);
      $('mirrorVTgl').classList.toggle('on', vs.mirrorV);
      $('rotate180Tgl').classList.toggle('on', vs.rotate180);
    }
    if (s.maxZoomTotal) {
      maxZoomTotal = s.maxZoomTotal;
      $('maxZoomSelect').value = s.maxZoomTotal;
    }
    if (s.zoomSpeed) {
      $('zoomSpeedRange').value = s.zoomSpeed;
      zoomLerp = s.zoomSpeed / 100;
    }
    if (s.grid) { gridEl.classList.add('on'); $('gridTgl').classList.add('on'); $('gridBtn').classList.add('active'); }
    if (s.cross) { crossEl.classList.add('on'); $('crossTgl').classList.add('on'); }
    if (s.note) $('noteInput').value = s.note;
  } catch(e){}
}

/* ============================================================
   PWA (single-file manifest + service worker)
   ============================================================ */
(function setupPWA() {
  const manifest = {
    name: 'MicroScope Pro', short_name: 'MicroScope',
    start_url: '.', scope: '.', display: 'standalone',
    orientation: 'any',
    background_color: '#0a0a0a', theme_color: '#0a0a0a',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="#00b3ff"/><circle cx="256" cy="256" r="140" fill="none" stroke="#fff" stroke-width="24"/><circle cx="256" cy="256" r="50" fill="#fff"/></svg>'
      ),
      sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'microscope-v3';
      self.addEventListener('install', e => {
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
      });
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
            const copy = resp.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
            return resp;
          }).catch(() => caches.match('./')))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(e => console.warn('SW:', e));
  }
})();

/* ============================================================
   Init
   ============================================================ */
loadSettings();
updateZoomUIRange();
startCamera();

stage.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (document.hidden && mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
});

if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  setTimeout(() => toast('⚠️ Camera needs HTTPS. Host on github.io / netlify / vercel', 6000), 1000);
}
